<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">جایگاه کوآنزیم Q10 در زنجیرهٔ انتقال الکترون</title>
<desc id="desc">دیاگرام آموزشی از کمپلکس‌های یک و دو به کوآنزیم Q و کمپلکس سه در غشای داخلی میتوکندری؛ این نقش زیستی اثربخشی مکمل برای شناخت را ثابت نمی‌کند.</desc>
<defs>
 <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0 0L14 7L0 14Z" fill="#20B8B0"/></marker>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10243A" flood-opacity=".08"/></filter>
</defs>
<rect width="1600" height="900" rx="34" fill="#F7F9FC"/>
<rect x="80" y="72" width="1440" height="756" rx="28" fill="#FFFFFF"/>
<text x="1450" y="132" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="22" font-weight="700" fill="#20B8B0">میتوکندری • نمایش آموزشی</text>
<text x="1450" y="205" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="42" font-weight="700" fill="#10243A">جایگاه Q10 در انتقال الکترون</text>
<text x="1450" y="253" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="20" fill="#687789">کوآنزیم Q میان اجزای زنجیرهٔ تنفسی، در غشای داخلی حرکت می‌کند.</text>
<rect x="180" y="330" width="1240" height="300" rx="28" fill="#EEF2F7" stroke="#DCE4EC" stroke-width="2"/>
<rect x="210" y="440" width="1180" height="96" rx="18" fill="#DDE6EF"/>
<text x="1350" y="390" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="18" fill="#687789">غشای داخلی میتوکندری</text>
<g filter="url(#shadow)">
 <rect x="1120" y="400" width="170" height="175" rx="20" fill="#FFFFFF" stroke="#C8D4E0" stroke-width="2"/>
 <rect x="835" y="400" width="190" height="175" rx="20" fill="#E6F8F6" stroke="#A9E1DC" stroke-width="2"/>
 <rect x="550" y="400" width="170" height="175" rx="20" fill="#FFFFFF" stroke="#C8D4E0" stroke-width="2"/>
 <rect x="300" y="400" width="155" height="175" rx="20" fill="#FFFFFF" stroke="#C8D4E0" stroke-width="2"/>
</g>
<text x="1205" y="475" text-anchor="middle" direction="ltr" font-family="Vazirmatn,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#10243A">I / II</text>
<text x="1205" y="520" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="18" fill="#687789">ورودی الکترون</text>
<text x="930" y="475" text-anchor="middle" direction="ltr" font-family="Vazirmatn,Tahoma,sans-serif" font-size="31" font-weight="700" fill="#087F79">CoQ</text>
<text x="930" y="520" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="18" fill="#526273">Q / QH₂</text>
<text x="635" y="475" text-anchor="middle" direction="ltr" font-family="Vazirmatn,Tahoma,sans-serif" font-size="30" font-weight="700" fill="#10243A">III</text>
<text x="635" y="520" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="18" fill="#687789">ادامهٔ زنجیره</text>
<text x="377" y="475" text-anchor="middle" direction="ltr" font-family="Vazirmatn,Tahoma,sans-serif" font-size="28" font-weight="700" fill="#10243A">IV</text>
<text x="377" y="520" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="18" fill="#687789">انتقال نهایی</text>
<path d="M1110 487H1040" fill="none" stroke="#20B8B0" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M825 487H735" fill="none" stroke="#20B8B0" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M540 487H470" fill="none" stroke="#20B8B0" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="180" y="680" width="1240" height="80" rx="18" fill="#10243A"/>
<text x="1345" y="730" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Vazirmatn,Tahoma,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">نقش در زنجیرهٔ انرژی، اثربخشی مکمل بر شناخت را به‌تنهایی اثبات نمی‌کند. [R13–R14]</text>
<text x="180" y="790" text-anchor="start" direction="ltr" font-family="Vazirmatn,Tahoma,sans-serif" font-size="16" fill="#687789">Conceptual diagram • Native components recommended for final PPTX</text>
